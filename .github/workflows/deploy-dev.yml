# .github/workflows/deploy-dev.yml

name: Deploy to Dev Environment

on:
  # 允许你从 GitHub UI 的 Actions 标签页手动触发此工作流
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to check out'
        required: true
        default: 'develop'
        type: choice
        options:
        - main
        - develop

  # 也可以保留推送到特定分支时自动触发的逻辑，如果需要的话
  # push:
  #   branches:
  #     - dev # 或者 main, 根据你的分支策略

jobs:
  # 第一个 Job: 运行测试
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies for testing
        run: |
          pip install -r dev-requirements.txt

      - name: Run tests with pytest
        run: |
          python -m pytest -v test/test_clean_data.py

  # 第二个 Job: 打包和部署，它依赖于 test Job 的成功
  deploy:
    name: Package and Deploy to Dev
    runs-on: ubuntu-latest
    needs: test # 保证在测试通过后才执行部署
    permissions:
      id-token: write  # OIDC权限：允许GitHub向AWS请求临时凭证
      contents: read   # 读权限：拉取repo代码
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_ARN }} # 使用 Dev 环境的 IAM Role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package the application source code
        run: |
          echo "Packaging source code and config files..."
          zip -r job.zip ./src ./config

      - name: Upload package to S3
        run: |
          aws s3 cp job.zip s3://data-platform-dev-etl-assets-us-east-1/scripts/job.zip # <-- TODO: 替换成你真实的开发环境S3桶

          echo "Deployment package uploaded successfully to S3."
          echo "Next step: Ensure your dev Glue Job in Terraform is configured with '--additional-python-modules' to include 'pyyaml==6.0.1'."

