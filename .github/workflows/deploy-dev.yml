# .github/workflows/deploy-dev.yml

name: Deploy to Dev Environment

on:
  # 允许你从 GitHub UI 的 Actions 标签页手动触发此工作流
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to check out'
        required: true
        default: 'develop'
        type: choice
        options:
        - main
        - develop

  # 也可以保留推送到特定分支时自动触发的逻辑，如果需要的话
  # push:
  #   branches:
  #     - dev # 或者 main, 根据你的分支策略

  schedule:
    # 每天 UTC 6:00 (东八区时间 14:00) 自动触发 dev 环境部署,在 terraform 之后.那个时候terraform 创建完，正好也有s3.
    - cron: '0 6 * * *'

jobs:
  # 第一个 Job: 运行测试
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies for testing
        run: |
          pip install -r dev-requirements.txt

      - name: Run tests with pytest
        run: |
          python -m pytest -v test/test_clean_data.py

  # 第二个 Job: 打包和部署，它依赖于 test Job 的成功
  deploy:
    name: Package and Deploy to Dev
    runs-on: ubuntu-latest
    needs: test # 保证在测试通过后才执行部署

    permissions:
      id-token: write # 允许 workflow 获取 OIDC token
      contents: read  # 允许 workflow 读取仓库内容

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Package the application source code
        run: |
          echo "Packaging source code and config files..."
          zip -r job.zip ./src ./config

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload package to S3
        run: |
          # 1. Upload zip package
          aws s3 cp job.zip s3://${{ secrets.DEV_GLUE_SCRIPTS_BUCKET }}/scripts/job.zip

          # 2. Upload main entry script
          aws s3 cp src/main/job_runner.py s3://${{ secrets.DEV_GLUE_SCRIPTS_BUCKET }}/scripts/job_runner.py
          
          # 3. Upload modified config
          aws s3 cp config/config_dev.yaml s3://${{ secrets.DEV_GLUE_SCRIPTS_BUCKET }}/scripts/config/config_dev.yaml

          # 4. Upload dimension tables (Data Ingestion Simulation)
          echo "Uploading dimension tables to S3..."
          aws s3 cp test_data/city_info.csv/city_info.csv s3://${{ secrets.DEV_GLUE_SCRIPTS_BUCKET }}/top-produce/data/city_info.csv
          aws s3 cp test_data/product_info.csv/product_info.csv s3://${{ secrets.DEV_GLUE_SCRIPTS_BUCKET }}/top-produce/data/product_info.csv

          echo "Deployment package and data uploaded successfully to S3."
          echo "Next step: Ensure your dev Glue Job in Terraform is configured with '--additional-python-modules' to include 'pyyaml==6.0.1'."

